services:
  agentos-db:
    image: agnohq/pgvector:18
    container_name: agentos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - agentos

  # Microsoft Playwright MCP server — drives a headless Chromium and exposes
  # browser-automation tools over MCP. The browser_agent talks to it via the
  # PLAYWRIGHT_MCP_URL env var, so swapping providers later is a one-line change.
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: playwright-mcp
    restart: unless-stopped
    init: true
    entrypoint: ["node"]
    command: >
      /app/cli.js --headless --browser chromium --no-sandbox
      --port 8931 --host 0.0.0.0 --allowed-hosts "*"
    ports:
      - "8931:8931"
    networks:
      - agentos

  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-agno-agentos}:${IMAGE_TAG:-latest}
    container_name: agentos-api
    # --reload-dir limits the watcher to code dirs only, avoiding spurious
    # restarts when editing docs/, scripts/, or temp files mid-conversation.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
      --reload-dir agents --reload-dir app --reload-dir db
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # Hot-reload: mount source code
      - .:/app
      # GCP Application Default Credentials (read-only) for Vertex AI / GenAI SDK
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    env_file:
      - path: .env
        required: false
    environment:
      - RUNTIME_ENV=dev
      - AGNO_DEBUG=True
      - PYTHONPATH=/app
      - AGENTOS_URL=http://127.0.0.1:8001
      # Database
      - DB_HOST=agentos-db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai}
      - DB_PASS=${DB_PASS:-ai}
      - DB_DATABASE=${DB_DATABASE:-ai}
      - WAIT_FOR_DB=True
      - PRINT_ENV_ON_LOAD=True
      # API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # GCP / Vertex AI
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/adc.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      # Force google-genai SDK into Vertex mode globally so any code path
      # that builds a default client picks up Vertex instead of the public
      # Gemini API (which requires an API key).
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_CLOUD_LOCATION=${GCP_LOCATION}
      # Browser Agent — Playwright MCP server URL (set automatically inside compose)
      - PLAYWRIGHT_MCP_URL=${PLAYWRIGHT_MCP_URL:-http://playwright-mcp:8931/mcp}
    depends_on:
      - agentos-db
      - playwright-mcp
    networks:
      - agentos
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  agentos:

volumes:
  pgdata:
